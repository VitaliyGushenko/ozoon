<header class="header">
  <div class="container">
    <a routerLink="/" class="logo">ozoon</a>
    <nav class="nav">
      <a routerLink="/">Главная</a>
      @if (isSeller()) {
        <a routerLink="/add-product">Добавить товар</a>
      }
      @if (isAdmin()) {
        <a routerLink="/users">Пользователи</a>
      }
      @if (user()) {
        <a routerLink="/profile">Профиль</a>
      } @else {
        <a routerLink="/auth">Войти</a>
      }
    </nav>
  </div>
</header>

<router-outlet />
