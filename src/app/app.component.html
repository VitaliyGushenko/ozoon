<div class="mesh-bg"></div>

<header class="header glass">
  <div class="container">
    <a routerLink="/" class="logo">ozoon</a>
    <nav class="nav">
      <a routerLink="/">Главная</a>
      @if (isSeller()) {
        <a routerLink="/add-product">Добавить товар</a>
      }
      @if (isAdmin()) {
        <a routerLink="/users">Пользователи</a>
      }
      @if (user()) {
        <a routerLink="/profile">Профиль</a>
      } @else {
        <a routerLink="/auth">Войти</a>
      }
      <button
        ui-button
        variant="glass"
        size="sm"
        type="button"
        (click)="toggleTheme()"
        [title]="theme() === 'light' ? 'Тёмная тема' : 'Светлая тема'"
      >
        {{ theme() === 'light' ? '🌙' : '☀️' }}
      </button>
    </nav>
  </div>
</header>

<router-outlet />
