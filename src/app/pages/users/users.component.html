<section class="users">
  <h1>Пользователи</h1>

  @if (users().length === 0) {
    <ui-card>
      <ui-empty-state icon="👥" text="Пользователей пока нет."></ui-empty-state>
    </ui-card>
  } @else {
    <ui-card class="users-card">
      <table class="users-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Роли</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users(); track user.id) {
            <tr>
              <td class="email">
                {{ user.email }}
                @if (isAdmin() && user.email === 'vit@mail.ru') {
                  <ui-badge tone="accent">Админ</ui-badge>
                }
              </td>
              <td class="roles">
                <ui-checkbox
                  label="Продавец"
                  [value]="hasRole(user, 'seller')"
                  (valueChange)="toggleRole(user.id, 'seller', $event === true)"
                ></ui-checkbox>
                <ui-checkbox
                  label="Модератор"
                  [value]="hasRole(user, 'moderator')"
                  (valueChange)="toggleRole(user.id, 'moderator', $event === true)"
                ></ui-checkbox>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </ui-card>
  }
</section>
