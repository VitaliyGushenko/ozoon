<section class="profile">
  <div class="profile-card">
    <h1>Профиль</h1>

    <p class="email">{{ user()?.email }}</p>

    <div class="roles">
      <span class="badge">Покупатель</span>
      @if (isAdmin()) {
        <span class="badge active">Админ</span>
      }
      @if (isModerator()) {
        <span class="badge active">Модератор</span>
      }
      @if (isSeller()) {
        <span class="badge active">Продавец</span>
      }
    </div>

    <button type="button" class="logout" (click)="logout()">Выйти</button>
  </div>
</section>
