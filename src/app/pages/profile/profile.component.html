<section class="profile">
  <div class="profile-card">
    <h1>Профиль</h1>

    <p class="email">{{ user()?.email }}</p>

    <label class="seller-toggle">
      <input
        type="checkbox"
        name="isSeller"
        [ngModel]="isSeller()"
        (ngModelChange)="toggleSeller($event)"
      />
      Я продавец
    </label>

    @if (isSeller()) {
      <a routerLink="/add-product" class="add-link">Добавить товар →</a>
    }

    <button type="button" class="logout" (click)="logout()">Выйти</button>
  </div>
</section>
