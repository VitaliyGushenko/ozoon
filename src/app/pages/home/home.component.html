<main class="home">
  <h1>Товары</h1>

  @if (products().length === 0) {
    <ui-empty-state
      icon="🛍️"
      text="Товаров пока нет. Загляните позже!"
    ></ui-empty-state>
  } @else {
    <div class="grid">
      @for (product of products(); track product.id) {
        <a class="card-link" [routerLink]="['/product', product.id]">
          <ui-card padding="none" class="card">
            <div class="card-image">
              <img
                [src]="product.images?.[0] ?? product.imageUrl"
                [alt]="product.title"
                loading="lazy"
                (error)="onImgError($event, product.category)"
              />
            </div>
            <div class="card-body">
              @if (categoryLabel(product.category)) {
                <ui-badge tone="accent">{{ categoryLabel(product.category) }}</ui-badge>
              }
              <h2>{{ product.title }}</h2>
              <p>{{ product.description }}</p>
            </div>
          </ui-card>
        </a>
      }
    </div>
  }
</main>
