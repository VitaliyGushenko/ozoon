<section class="auth">
  <ui-card padding="lg" class="auth-card">
    <h1>{{ mode() === 'login' ? 'Вход' : 'Регистрация' }}</h1>

    <form (ngSubmit)="submit()">
      <ui-input
        label="Email"
        type="email"
        placeholder="you@example.com"
        [(ngModel)]="email"
        name="email"
        required
      ></ui-input>

      <ui-input
        label="Пароль"
        type="password"
        placeholder="Минимум 6 символов"
        [(ngModel)]="password"
        name="password"
        required
      ></ui-input>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button ui-button variant="primary" [block]="true" type="submit" [disabled]="busy">
        {{ busy ? 'Подождите…' : mode() === 'login' ? 'Войти' : 'Зарегистрироваться' }}
      </button>
    </form>

    <p class="switch">
      @if (mode() === 'login') {
        Нет аккаунта?
        <button type="button" class="link" (click)="switchMode('register')">
          Зарегистрируйтесь
        </button>
      } @else {
        Уже есть аккаунт?
        <button type="button" class="link" (click)="switchMode('login')">
          Войдите
        </button>
      }
    </p>
  </ui-card>
</section>
